[project]
name = "agentic-mail"
version = "0.1.0"
description = "Agentic email workflow prototype"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
  "redis>=5.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "jsonschema>=4.21",
  "cryptography>=42.0",
  "textual>=0.63",
]
