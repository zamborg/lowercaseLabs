services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_mail}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agentic_mail}
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agentic_mail}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  mail-sync:
    build:
      context: .
      dockerfile: services/mail-sync/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agentic_mail}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  tui:
    build:
      context: .
      dockerfile: services/tui/Dockerfile
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    stdin_open: true
    tty: true

volumes:
  pgdata:
