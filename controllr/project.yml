name: Controllr
options:
  bundleIdPrefix: com.lowercaselabs
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM: pass on the command line / set locally for device builds
packages:
  ControllrCore:
    path: ControllrCore
targets:
  Controllr:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: ControllrCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lowercaselabs.controllr
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: controllr
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSContactsUsageDescription: controllr looks up contacts to text or call the person you name.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: controllr adds reminders you ask for.
        INFOPLIST_KEY_NSRemindersUsageDescription: controllr adds reminders you ask for.
  ControllrTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Controllr
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Controllr:
    build:
      targets:
        Controllr: all
    test:
      targets:
        - ControllrTests
