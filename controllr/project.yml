name: Controllr
options:
  bundleIdPrefix: com.lowercaselabs
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    # DEVELOPMENT_TEAM: pass on the command line / set locally for device builds
packages:
  ControllrCore:
    path: ControllrCore
targets:
  Controllr:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: ControllrCore
      - target: ControllrTimerWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lowercaselabs.controllr
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: controllr
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Controllr reads your agenda and adds or changes events you ask for.
        INFOPLIST_KEY_NSContactsUsageDescription: controllr looks up contacts to text or call the person you name.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Controllr reads and updates reminders you ask about.
        INFOPLIST_KEY_NSRemindersUsageDescription: Controllr reads and updates reminders you ask about.
        INFOPLIST_KEY_NSAlarmKitUsageDescription: Controllr starts the timers you ask for and alerts you when they finish.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
  ControllrTimerWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources: [Shared, TimerWidget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lowercaselabs.controllr.TimerWidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Controllr Timer
        SKIP_INSTALL: YES
    info:
      path: build/generated/TimerWidget-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ControllrTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Controllr
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Controllr:
    build:
      targets:
        Controllr: all
    test:
      targets:
        - ControllrTests
