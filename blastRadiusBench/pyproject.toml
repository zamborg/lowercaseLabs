[project]
name = "blast-radius-bench"
version = "0.1.0"
description = "Benchmark context blast radius for coding agents using Harbor ATIF trajectories."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "datasets>=4.7.0",
  "harbor>=0.1.45",
  "matplotlib>=3.10.8",
  "pandas>=3.0.1",
  "pydantic>=2.11.0",
  "pyyaml>=6.0.2",
  "rich>=13.9.4",
  "typer>=0.16.0",
]

[project.scripts]
blast-radius-bench = "blast_radius_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

