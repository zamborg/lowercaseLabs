<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>roundRobin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; background: #0a0a0a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

  /* Tabs */
  nav { display: flex; background: #111; border-bottom: 1px solid #222; }
  nav button { background: none; border: none; color: #666; padding: 10px 20px; font-family: inherit; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; }
  nav button:hover { color: #aaa; }
  nav button.active { color: #fff; border-bottom-color: #6ae; }
  .tab-right { margin-left: auto; display: flex; align-items: center; padding-right: 16px; gap: 12px; }
  #status { font-size: 11px; color: #666; }
  #run-status { font-size: 11px; padding: 3px 8px; border-radius: 8px; }
  #run-status.idle { color: #666; }
  #run-status.running { color: #2d5; background: rgba(34,170,85,0.1); }

  /* Panels */
  .panel { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  .panel.active { display: flex; }

  /* Chat panel */
  #agents-bar { padding: 8px 20px; background: #0f0f0f; border-bottom: 1px solid #1a1a1a; display: flex; gap: 12px; flex-wrap: wrap; min-height: 36px; }
  .agent-badge { font-size: 11px; padding: 3px 10px; border-radius: 12px; border: 1px solid #333; }
  .agent-badge.connected { border-color: #2d5; }
  #messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 6px; }
  .msg { padding: 6px 12px; border-radius: 6px; max-width: 85%; font-size: 13px; line-height: 1.5; word-wrap: break-word; }
  .msg .author { font-weight: 700; margin-right: 8px; }
  .msg .time { font-size: 10px; color: #555; margin-left: 8px; }
  .msg.system { color: #666; font-style: italic; align-self: center; background: none; font-size: 11px; }
  .msg.consensus { border: 1px solid #2a5; background: rgba(34, 170, 85, 0.08); }
  .msg.human { border-left: 3px solid #f80; }
  #input-bar { padding: 12px 20px; background: #111; border-top: 1px solid #222; display: flex; gap: 8px; }
  #input-bar input { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; padding: 8px 12px; border-radius: 6px; font-family: inherit; font-size: 13px; outline: none; }
  #input-bar input:focus { border-color: #555; }
  #input-bar button { background: #333; color: #e0e0e0; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px; }
  #input-bar button:hover { background: #444; }

  /* Logs panel */
  #logs { display: none; flex-direction: column; }
  #logs.active { display: flex; }
  #logs-toolbar { padding: 8px 20px; background: #0f0f0f; border-bottom: 1px solid #1a1a1a; display: flex; gap: 8px; align-items: center; }
  #logs-toolbar button { background: #1a1a1a; border: 1px solid #333; color: #888; padding: 4px 12px; border-radius: 6px; font-family: inherit; font-size: 11px; cursor: pointer; }
  #logs-toolbar button:hover { border-color: #555; color: #ccc; }
  #logs-toolbar button.active { border-color: #6ae; color: #6ae; }
  #logs-container { flex: 1; display: flex; overflow: hidden; }
  .log-pane { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #1a1a1a; min-width: 0; }
  .log-pane:last-child { border-right: none; }
  .log-pane-header { padding: 6px 12px; background: #111; font-size: 11px; font-weight: 600; border-bottom: 1px solid #1a1a1a; }
  .log-pane-body { flex: 1; overflow-y: auto; padding: 8px 12px; }
  .log-entry { font-size: 11px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; color: #999; border-bottom: 1px solid #111; padding: 2px 0; }
  .log-entry .log-ts { color: #444; margin-right: 6px; }
  .log-entry .log-type { color: #6ae; margin-right: 6px; }
  .log-raw { font-size: 11px; line-height: 1.5; white-space: pre-wrap; color: #bbb; padding: 8px 0; }

  /* Config panel */
  #config-panel { padding: 24px; overflow-y: auto; }
  .config-section { margin-bottom: 24px; }
  .config-section h2 { font-size: 14px; color: #aaa; margin-bottom: 12px; font-weight: 600; }
  .config-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .config-card { background: #151515; border: 1px solid #282828; border-radius: 8px; padding: 12px 16px; cursor: pointer; transition: border-color 0.15s; min-width: 180px; }
  .config-card:hover { border-color: #444; }
  .config-card.selected { border-color: #6ae; background: rgba(102,170,238,0.05); }
  .config-card h3 { font-size: 13px; font-weight: 600; color: #e0e0e0; margin-bottom: 4px; }
  .config-card p { font-size: 11px; color: #666; line-height: 1.4; }
  .config-card .tag { font-size: 10px; color: #888; background: #1a1a1a; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 6px; }

  /* Buttons */
  .btn { padding: 10px 24px; border-radius: 8px; border: none; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .btn-primary { background: #2a7; color: #fff; }
  .btn-primary:hover { background: #3b8; }
  .btn-primary:disabled { background: #1a3a2a; color: #555; cursor: not-allowed; }
  .btn-danger { background: #a33; color: #fff; }
  .btn-danger:hover { background: #c44; }
  .actions-bar { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  #launch-feedback { font-size: 12px; color: #888; }
</style>
</head>
<body>

<nav>
  <button class="tab-btn active" data-tab="chat">Chat</button>
  <button class="tab-btn" data-tab="logs">Logs</button>
  <button class="tab-btn" data-tab="config">Config</button>
  <div class="tab-right">
    <span id="run-status" class="idle">idle</span>
    <span id="status">connecting...</span>
  </div>
</nav>

<!-- Chat Panel -->
<div id="chat" class="panel active">
  <div id="agents-bar"></div>
  <div id="messages"></div>
  <div id="input-bar">
    <input id="msg-input" type="text" placeholder="Send a message as human..." autocomplete="off" />
    <button id="send-btn">Send</button>
  </div>
</div>

<!-- Logs Panel -->
<div id="logs" class="panel">
  <div id="logs-toolbar">
    <span style="color:#666;font-size:11px">View:</span>
    <button id="logs-mode-split" class="active">Split</button>
    <button id="logs-mode-jsonl">JSONL</button>
  </div>
  <div id="logs-container"></div>
</div>

<!-- Config Panel -->
<div id="config" class="panel">
  <div id="config-panel">
    <div class="config-section">
      <h2>Task</h2>
      <div id="tasks-grid" class="config-grid"><p style="color:#555">Loading...</p></div>
    </div>
    <div class="config-section">
      <h2>Souls (select agents for this run)</h2>
      <div id="souls-grid" class="config-grid"><p style="color:#555">Loading...</p></div>
    </div>
    <div class="actions-bar">
      <button id="launch-btn" class="btn btn-primary" disabled>Start Run</button>
      <button id="kill-btn" class="btn btn-danger" style="display:none">Kill Run</button>
      <span id="launch-feedback"></span>
    </div>
  </div>
</div>

<script>
// --- Tabs ---
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

// --- Chat ---
const COLORS = ['#e6a', '#6ae', '#ae6', '#ea6', '#a6e', '#6ea', '#e66', '#66e'];
const colorMap = {};
let colorIdx = 0;
function getColor(agentId) {
  if (agentId === 'system') return '#666';
  if (agentId === 'human') return '#f80';
  if (!colorMap[agentId]) colorMap[agentId] = COLORS[colorIdx++ % COLORS.length];
  return colorMap[agentId];
}

const messagesEl = document.getElementById('messages');
const statusEl = document.getElementById('status');
const runStatusEl = document.getElementById('run-status');
const agentsBar = document.getElementById('agents-bar');
const msgInput = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
let pinned = true;

messagesEl.addEventListener('scroll', () => {
  pinned = messagesEl.scrollTop + messagesEl.clientHeight >= messagesEl.scrollHeight - 30;
});
function scrollBottom() { if (pinned) messagesEl.scrollTop = messagesEl.scrollHeight; }

function renderMsg(msg) {
  const div = document.createElement('div');
  div.className = 'msg';
  if (msg.type === 'system') { div.classList.add('system'); div.textContent = msg.content; }
  else if (msg.type === 'consensus') {
    div.classList.add('consensus');
    div.innerHTML = `<span class="author" style="color:${getColor(msg.agent_id)}">${msg.agent_id}</span><span>[CONSENSUS]</span> ${esc(msg.content)}<span class="time">${fmtTime(msg.timestamp)}</span>`;
  } else {
    if (msg.agent_id === 'human') div.classList.add('human');
    div.innerHTML = `<span class="author" style="color:${getColor(msg.agent_id)}">${msg.agent_id}</span>${esc(msg.content)}<span class="time">${fmtTime(msg.timestamp)}</span>`;
  }
  messagesEl.appendChild(div);
  scrollBottom();
}

function esc(s) { const d = document.createElement('span'); d.textContent = s; return d.innerHTML; }
function fmtTime(ts) { try { return new Date(ts).toLocaleTimeString(); } catch { return ''; } }

fetch('/api/messages').then(r => r.json()).then(msgs => { msgs.forEach(renderMsg); scrollBottom(); });

let ws;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws/ui`);
  ws.onopen = () => { statusEl.textContent = 'connected'; statusEl.style.color = '#2d5'; };
  ws.onclose = () => { statusEl.textContent = 'disconnected'; statusEl.style.color = '#e44'; setTimeout(connect, 2000); };
  ws.onmessage = (e) => { try { renderMsg(JSON.parse(e.data)); } catch {} };
}
connect();

function refreshAgents() {
  fetch('/api/agents').then(r => r.json()).then(agents => {
    agentsBar.innerHTML = '';
    agents.forEach(a => {
      const badge = document.createElement('span');
      badge.className = 'agent-badge connected';
      badge.style.color = getColor(a.id);
      badge.style.borderColor = getColor(a.id);
      badge.textContent = a.id + (a.consensus ? ' [consensus]' : '');
      agentsBar.appendChild(badge);
    });
  }).catch(() => {});
}
refreshAgents();
setInterval(refreshAgents, 3000);

function send() {
  const text = msgInput.value.trim();
  if (!text) return;
  fetch('/api/message', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ agent_id: 'human', content: text }) });
  msgInput.value = '';
}
sendBtn.addEventListener('click', send);
msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

// --- Config ---
let selectedTask = null;
let selectedSouls = new Set();

async function loadConfig() {
  const [tasks, souls] = await Promise.all([
    fetch('/api/tasks').then(r => r.json()),
    fetch('/api/souls').then(r => r.json()),
  ]);

  const tasksGrid = document.getElementById('tasks-grid');
  tasksGrid.innerHTML = '';
  tasks.forEach(t => {
    const card = document.createElement('div');
    card.className = 'config-card';
    card.innerHTML = `<h3>${t.name}</h3><p>${t.hasTask ? 'task.md ✓' : 'no task.md'}</p>${t.hasData ? '<span class="tag">data/</span>' : ''}`;
    card.addEventListener('click', () => {
      tasksGrid.querySelectorAll('.config-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedTask = t;
      updateLaunchBtn();
    });
    tasksGrid.appendChild(card);
  });

  const soulsGrid = document.getElementById('souls-grid');
  soulsGrid.innerHTML = '';
  souls.forEach(s => {
    const card = document.createElement('div');
    card.className = 'config-card';
    const lines = s.content.split('\n').filter(l => l.startsWith('- ')).slice(0, 2).map(l => l.slice(2)).join(', ');
    card.innerHTML = `<h3>${s.name}</h3><p>${lines || s.file}</p><span class="tag">${s.file}</span>`;
    card.addEventListener('click', () => {
      if (selectedSouls.has(s.file)) { selectedSouls.delete(s.file); card.classList.remove('selected'); }
      else { selectedSouls.add(s.file); card.classList.add('selected'); }
      updateLaunchBtn();
    });
    soulsGrid.appendChild(card);
  });
}

function updateLaunchBtn() {
  const btn = document.getElementById('launch-btn');
  btn.disabled = !selectedTask || selectedSouls.size === 0;
}

async function refreshRunStatus() {
  try {
    const run = await fetch('/api/run').then(r => r.json());
    runStatusEl.textContent = run.status;
    runStatusEl.className = run.status;
    document.getElementById('kill-btn').style.display = run.status === 'running' ? '' : 'none';
    document.getElementById('launch-btn').style.display = run.status === 'running' ? 'none' : '';
  } catch {}
}

document.getElementById('launch-btn').addEventListener('click', async () => {
  if (!selectedTask || selectedSouls.size === 0) return;
  const feedback = document.getElementById('launch-feedback');
  feedback.textContent = 'Starting run...';
  const btn = document.getElementById('launch-btn');
  btn.disabled = true;

  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        task: selectedTask.name,
        souls: Array.from(selectedSouls),
      }),
    });
    const data = await res.json();
    if (data.error) { feedback.textContent = data.error; btn.disabled = false; }
    else {
      feedback.textContent = 'Run started! Switching to Chat...';
      setTimeout(() => {
        document.querySelector('[data-tab="chat"]').click();
        feedback.textContent = '';
      }, 1500);
    }
  } catch (e) { feedback.textContent = 'Error: ' + e.message; btn.disabled = false; }
  refreshRunStatus();
});

document.getElementById('kill-btn').addEventListener('click', async () => {
  await fetch('/api/run/kill', { method: 'POST' });
  document.getElementById('launch-feedback').textContent = 'Run killed.';
  refreshRunStatus();
});

loadConfig();
refreshRunStatus();
setInterval(refreshRunStatus, 5000);

// --- Logs ---
// Generic log renderer — stubbed for future expansion (structured logs, filters, etc.)
const LogRenderer = {
  streams: new Map(),  // agent_id -> EventSource
  entries: new Map(),  // agent_id -> [{ts, type, content}]
  mode: 'split',       // 'split' | 'jsonl'
  maxEntries: 500,

  init() {
    document.getElementById('logs-mode-split').addEventListener('click', () => this.setMode('split'));
    document.getElementById('logs-mode-jsonl').addEventListener('click', () => this.setMode('jsonl'));
  },

  setMode(mode) {
    this.mode = mode;
    document.getElementById('logs-mode-split').classList.toggle('active', mode === 'split');
    document.getElementById('logs-mode-jsonl').classList.toggle('active', mode === 'jsonl');
    this.render();
  },

  // Start streaming logs for current run agents
  async refresh() {
    // Stop old streams
    for (const [, es] of this.streams) es.close();
    this.streams.clear();
    this.entries.clear();

    try {
      const run = await fetch('/api/run').then(r => r.json());
      if (run.status !== 'running' || !run.agents?.length) {
        document.getElementById('logs-container').innerHTML = '<div style="padding:24px;color:#555">No active run. Start one from the Config tab.</div>';
        return;
      }

      for (const agent of run.agents) {
        this.entries.set(agent.id, []);
        const es = new EventSource(`/api/logs/${agent.id}`);
        es.onmessage = (e) => {
          try {
            const entry = JSON.parse(e.data);
            const arr = this.entries.get(agent.id) || [];
            arr.push(entry);
            if (arr.length > this.maxEntries) arr.shift();
            this.entries.set(agent.id, arr);
            this.render();
          } catch {}
        };
        this.streams.set(agent.id, es);
      }
      this.render();
    } catch {}
  },

  render() {
    const container = document.getElementById('logs-container');
    if (this.mode === 'jsonl') {
      this.renderJsonl(container);
    } else {
      this.renderSplit(container);
    }
  },

  renderSplit(container) {
    // One pane per agent, side by side
    const agentIds = Array.from(this.entries.keys());
    if (!agentIds.length) { container.innerHTML = '<div style="padding:24px;color:#555">Waiting for agents...</div>'; return; }

    // Create/update panes
    if (container.children.length !== agentIds.length || container.dataset.mode !== 'split') {
      container.dataset.mode = 'split';
      container.innerHTML = '';
      for (const id of agentIds) {
        const pane = document.createElement('div');
        pane.className = 'log-pane';
        pane.id = `log-pane-${id}`;
        pane.innerHTML = `<div class="log-pane-header" style="color:${getColor(id)}">${id}</div><div class="log-pane-body"><div class="log-raw"></div></div>`;
        container.appendChild(pane);
      }
    }

    for (const id of agentIds) {
      const pane = document.getElementById(`log-pane-${id}`);
      if (!pane) continue;
      const body = pane.querySelector('.log-raw');
      const entries = this.entries.get(id) || [];
      const latest = entries[entries.length - 1];
      if (latest) {
        body.textContent = latest.content;
        const bodyContainer = pane.querySelector('.log-pane-body');
        bodyContainer.scrollTop = bodyContainer.scrollHeight;
      }
    }
  },

  renderJsonl(container) {
    if (container.dataset.mode !== 'jsonl') {
      container.dataset.mode = 'jsonl';
      container.innerHTML = '<div class="log-pane" style="flex:1"><div class="log-pane-header" style="color:#6ae">JSONL Stream</div><div class="log-pane-body" id="jsonl-body"></div></div>';
    }
    const body = document.getElementById('jsonl-body');
    if (!body) return;

    // Merge all entries, sort by timestamp
    const all = [];
    for (const [, entries] of this.entries) {
      for (const e of entries) all.push(e);
    }
    all.sort((a, b) => a.ts < b.ts ? -1 : 1);

    // Only render last 200
    const recent = all.slice(-200);
    body.innerHTML = recent.map(e => {
      const line = JSON.stringify(e);
      return `<div class="log-entry">${esc(line)}</div>`;
    }).join('');
    body.scrollTop = body.scrollHeight;
  },

  stop() {
    for (const [, es] of this.streams) es.close();
    this.streams.clear();
  }
};

LogRenderer.init();

// Refresh logs when switching to logs tab or when run status changes
const origTabClick = document.querySelectorAll('.tab-btn');
origTabClick.forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.tab === 'logs') LogRenderer.refresh();
    else LogRenderer.stop();
  });
});

// Also refresh logs when run starts
const origRefreshRunStatus = refreshRunStatus;
</script>
</body>
</html>
