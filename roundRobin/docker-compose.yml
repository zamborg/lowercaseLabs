services:
  roundrobin:
    build: .
    ports:
      - "9090:9090"
    volumes:
      - ./runs:/app/runs
      - ./tasks:/app/tasks
      - ./souls:/app/souls
      - ./prompts:/app/prompts
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    # Override to run full orchestrator:
    # docker compose run roundrobin ./bin/roundrobin --task ... --source ... --souls ...
