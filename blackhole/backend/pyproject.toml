[project]
name = "blackhole-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.8.0",
    "openai>=1.40.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"
