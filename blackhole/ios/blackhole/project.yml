name: blackhole
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
targets:
  blackhole:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: labs.lowercase.blackhole
        PRODUCT_NAME: blackhole
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: blackhole
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: blackhole records voice captures for notes, todos, and search.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: blackhole may transcribe and route captures.
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
  blackholeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/blackholeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: labs.lowercase.blackholeTests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    dependencies:
      - target: blackhole
schemes:
  blackhole:
    build:
      targets:
        blackhole: all
        blackholeTests: [test]
    test:
      targets:
        - blackholeTests

