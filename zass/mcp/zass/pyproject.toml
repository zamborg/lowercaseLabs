[project]
name = "zass-mcp"
version = "0.1.0"
description = "zass internal MCP server: file-backed personal assistant primitives (todos, notes, people, memory, journal) plus local macOS connectors (iMessage, Contacts)."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6.0",
]

[project.scripts]
zass-mcp = "zass_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zass_mcp"]
