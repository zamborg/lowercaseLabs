services:
  edge-filter:
    networks:
      - default
      - zos_edge

  cloudflared:
    image: cloudflare/cloudflared:2026.11.2
    restart: unless-stopped
    # Note: --url sets the fallback origin when no remote ingress rules are defined.
    # For remotely-managed tunnels (TUNNEL_TOKEN), Cloudflare Zero Trust dashboard Public Hostnames
    # must target http://edge-filter:8000; cloudflared is isolated on zos_edge so it cannot reach
    # zos:8080 directly or bypass the path allowlist.
    command: tunnel --no-autoupdate run --url http://edge-filter:8000
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN}
    depends_on:
      edge-filter:
        condition: service_started
    networks:
      - zos_edge

networks:
  zos_edge:
