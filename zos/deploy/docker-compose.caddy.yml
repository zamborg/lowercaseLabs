services:
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on:
      zos:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/Caddyfile.allowlist:/etc/caddy/Caddyfile.allowlist:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default

volumes:
  caddy_data:
  caddy_config:
