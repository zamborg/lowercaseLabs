services:
  edge-filter:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on:
      zos:
        condition: service_healthy
    volumes:
      - ./caddy/Caddyfile.filter:/etc/caddy/Caddyfile:ro
      - ./caddy/Caddyfile.allowlist:/etc/caddy/Caddyfile.allowlist:ro
    networks:
      - default
