[project]
name = "zos-actuator"
version = "0.1.0"
description = "Standalone macOS actuator daemon for ZOS"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9.0",
    "websockets>=14.0",
]

[project.scripts]
zos-actuator = "zos_actuator.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zos_actuator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
