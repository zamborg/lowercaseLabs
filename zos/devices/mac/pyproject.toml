[project]
name = "zos-mac"
version = "0.3.0"
description = "Standalone macOS stdio MCP server for ZOS (Contacts, iMessage/SMS read and send, persistent tmux shell)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9.0",
]

[project.scripts]
zos-mac = "zos_mac.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zos_mac"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
