manifest_version = 1
slug = "cfbuilds"
name = "Cloudflare Workers Builds"
description = "Official Cloudflare remote MCP server for inspecting and managing Workers Builds."
docs_url = "https://github.com/cloudflare/mcp-server-cloudflare"

[runtime]
kind = "remote"
url = "https://builds.mcp.cloudflare.com/mcp"

[auth]
mode = "oauth"

[tiers]
default = "external"
"*_list*" = "read"
"*_get*" = "read"
"*_search*" = "read"
