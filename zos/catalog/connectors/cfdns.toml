manifest_version = 1
slug = "cfdns"
name = "Cloudflare DNS Analytics"
description = "Official Cloudflare remote MCP server for DNS analytics reports and query metrics."
docs_url = "https://github.com/cloudflare/mcp-server-cloudflare"

[runtime]
kind = "remote"
url = "https://dns-analytics.mcp.cloudflare.com/mcp"

[auth]
mode = "oauth"

[tiers]
default = "read"
