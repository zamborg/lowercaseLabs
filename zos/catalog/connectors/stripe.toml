manifest_version = 1
slug = "stripe"
name = "Stripe"
description = "Official Stripe remote MCP server for customers, invoices, payments, subscriptions, and docs."
docs_url = "https://docs.stripe.com/mcp"

[runtime]
kind = "remote"
url = "https://mcp.stripe.com/"

[auth]
mode = "oauth"

[tiers]
default = "external"
"*_list*" = "read"
"*_get*" = "read"
"*_retrieve*" = "read"
"*_search*" = "read"
