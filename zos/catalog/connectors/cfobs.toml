manifest_version = 1
slug = "cfobs"
name = "Cloudflare Observability"
description = "Official Cloudflare remote MCP server for Workers logs, traces, and observability queries."
docs_url = "https://github.com/cloudflare/mcp-server-cloudflare"

[runtime]
kind = "remote"
url = "https://observability.mcp.cloudflare.com/mcp"

[auth]
mode = "oauth"

[tiers]
default = "external"
"*_list*" = "read"
"*_get*" = "read"
"*_query*" = "read"
"*_search*" = "read"
