manifest_version = 1
slug = "cloudflare"
name = "Cloudflare API"
description = "Official Cloudflare unified remote MCP server covering Workers, DNS, R2, D1, KV, and account APIs."
docs_url = "https://github.com/cloudflare/mcp-server-cloudflare"

[runtime]
kind = "remote"
url = "https://mcp.cloudflare.com/mcp"

[auth]
mode = "oauth"

[tiers]
default = "external"
"*_search*" = "read"
"*_list*" = "read"
"*_get*" = "read"
