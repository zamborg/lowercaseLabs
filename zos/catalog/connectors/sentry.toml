manifest_version = 1
slug = "sentry"
name = "Sentry"
description = "Official Sentry remote MCP server for issues, events, stack traces, releases, and projects."
docs_url = "https://docs.sentry.io/product/sentry-mcp/"

[runtime]
kind = "remote"
url = "https://mcp.sentry.dev/mcp"

[auth]
mode = "oauth"

[tiers]
default = "external"
"*_list*" = "read"
"*_get*" = "read"
"*_search*" = "read"
"*_find*" = "read"
