manifest_version = 1
slug = "github"
name = "GitHub"
description = "Official GitHub remote MCP server for repositories, issues, pull requests, code search, and Actions."
docs_url = "https://github.com/github/github-mcp-server"

[runtime]
kind = "remote"
url = "https://api.githubcopilot.com/mcp/"

[auth]
mode = "bearer"
token_help = "Create a fine-grained Personal Access Token at https://github.com/settings/personal-access-tokens/new with minimum scopes for the repos you want (e.g. Contents: Read, Issues: Read/Write, Pull requests: Read/Write). GitHub's OAuth AS does not support DCR."

[tiers]
default = "external"
"*_list*" = "read"
"*_get*" = "read"
"*_search*" = "read"
"github_get_me" = "read"
"github_get_file_contents" = "read"
"github_list_branches" = "read"
"github_list_commits" = "read"
"github_list_issues" = "read"
"github_list_pull_requests" = "read"
"github_search_code" = "read"
"github_search_issues" = "read"
"github_search_repositories" = "read"
