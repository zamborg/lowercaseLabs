manifest_version = 1
slug = "figma"
name = "Figma"
description = "Official Figma remote MCP server for design files, frames, variables, and code context."
docs_url = "https://developers.figma.com/docs/figma-mcp-server/"

[runtime]
kind = "remote"
url = "https://mcp.figma.com/mcp"

[auth]
mode = "oauth"

[tiers]
default = "external"
"*_get*" = "read"
"*_list*" = "read"
"*_search*" = "read"
