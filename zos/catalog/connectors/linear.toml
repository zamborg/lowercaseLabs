manifest_version = 1
slug = "linear"
name = "Linear"
description = "Official Linear remote MCP server for issues, projects, cycles, teams, and comments."
docs_url = "https://linear.app/docs/mcp"

[runtime]
kind = "remote"
url = "https://mcp.linear.app/mcp"

[auth]
mode = "oauth"

[tiers]
default = "external"
"*_list*" = "read"
"*_get*" = "read"
"*_search*" = "read"
