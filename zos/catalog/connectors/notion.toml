manifest_version = 1
slug = "notion"
name = "Notion"
description = "Official Notion remote MCP server for searching, reading, and editing Notion pages and databases."
docs_url = "https://developers.notion.com/docs/mcp"

[runtime]
kind = "remote"
url = "https://mcp.notion.com/mcp"

[auth]
mode = "oauth"

[tiers]
default = "external"
"*_search*" = "read"
"*_fetch*" = "read"
"*_get*" = "read"
"*_list*" = "read"
