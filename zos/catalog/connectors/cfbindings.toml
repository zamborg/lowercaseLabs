manifest_version = 1
slug = "cfbindings"
name = "Cloudflare Workers Bindings"
description = "Official Cloudflare remote MCP server for Workers KV, R2, D1, Hyperdrive, and Workers scripts."
docs_url = "https://github.com/cloudflare/mcp-server-cloudflare"

[runtime]
kind = "remote"
url = "https://bindings.mcp.cloudflare.com/mcp"

[auth]
mode = "oauth"

[tiers]
default = "external"
"*_list*" = "read"
"*_get*" = "read"
"*_search*" = "read"
