manifest_version = 1
slug = "slack"
name = "Slack"
description = "Official Slack remote MCP server for searching messages, reading channels, and posting updates."
docs_url = "https://docs.slack.dev/ai/mcp-server/"

[runtime]
kind = "remote"
url = "https://mcp.slack.com/mcp"

[auth]
mode = "oauth"
requires_client_registration = true
client_help = "Slack's OAuth AS does not support Dynamic Client Registration (DCR). Create a Slack OAuth app at https://api.slack.com/apps, add redirect URL <ZOS_BASE_URL>/connect/<slug>/callback, and enter its Client ID and Client Secret before clicking Connect."

[tiers]
default = "external"
"*_list*" = "read"
"*_get*" = "read"
"*_search*" = "read"
"*_read*" = "read"
