manifest_version = 1
slug = "supabase"
name = "Supabase"
description = "Official Supabase remote MCP server for projects, schemas, edge functions, logs, and docs."
docs_url = "https://supabase.com/docs/guides/getting-started/mcp"

[runtime]
kind = "remote"
url = "https://mcp.supabase.com/mcp"

[auth]
mode = "oauth"

[tiers]
default = "external"
"*_list*" = "read"
"*_get*" = "read"
"*_search*" = "read"
