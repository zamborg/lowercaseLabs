manifest_version = 2
slug = "memory"
name = "Memory"
version = "0.1.0"
description = "Postgres full-text and trigram memory store shared across your agents."

[runtime]
kind = "container"
build = "modules/memory"
mcp_port = 8081
mcp_path = "/mcp"
ui_port = 8082

[storage]
postgres = true
extensions = ["pg_trgm"]

[network]
egress = false

[ui]
title = "Memory"
path = "/"

[tiers]
default = "write"
"memory_get" = "read"
"memory_search" = "read"
"memory_list" = "read"
"memory_put" = "write"
"memory_delete" = "write"
