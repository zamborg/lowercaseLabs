manifest_version = 2
slug = "gmail"
name = "Gmail"
version = "0.1.0"
description = "Search, read, and send Gmail messages via your own Google OAuth connection."

[runtime]
kind = "container"
build = "modules/google"
mcp_port = 8081
mcp_path = "/mcp"
ui_port = 8082

[storage]
postgres = true

[network]
egress = true

[ui]
title = "Gmail"
path = "/"

[[config]]
name = "GOOGLE_CLIENT_ID"
secret = false
required = true
help = "Google Cloud OAuth 2.0 Web Application Client ID"

[[config]]
name = "GOOGLE_CLIENT_SECRET"
secret = true
required = true
help = "Google Cloud OAuth 2.0 Web Application Client Secret"

[tiers]
default = "external"
"gmail_search" = "read"
"gmail_read" = "read"
"gmail_send" = "external"
