manifest_version = 2
slug = "gcal"
name = "Google Calendar"
version = "0.1.0"
description = "List, search, inspect, and manage Google Calendar events (REST API or Google Calendar MCP backend)."

[runtime]
kind = "container"
build = "modules/google"
mcp_port = 8081
mcp_path = "/mcp"
ui_port = 8082

[storage]
postgres = true

[network]
egress = true

[ui]
title = "Google Calendar"
path = "/"

[[config]]
name = "GOOGLE_CLIENT_ID"
secret = false
required = true
help = "Google Cloud OAuth 2.0 Web Application Client ID"

[[config]]
name = "GOOGLE_CLIENT_SECRET"
secret = true
required = true
help = "Google Cloud OAuth 2.0 Web Application Client Secret"

[[config]]
name = "GCAL_BACKEND"
secret = false
required = false
default = "api"
help = "Calendar backend: api (REST v3) or mcp (Google Calendar MCP)"

[[config]]
name = "GCAL_MCP_URL"
secret = false
required = false
default = "https://calendarmcp.googleapis.com/mcp/v1"
help = "Remote Google Calendar MCP URL when GCAL_BACKEND=mcp"

[tiers]
default = "external"
"gcal_list_events" = "read"
"gcal_get_event" = "read"
"gcal_list_calendars" = "read"
"gcal_suggest_time" = "read"
"gcal_search_events" = "read"
"gcal_freebusy" = "read"
"gcal_create_event" = "external"
"gcal_update_event" = "external"
"gcal_delete_event" = "external"
"gcal_respond_to_event" = "external"
