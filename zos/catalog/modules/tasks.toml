manifest_version = 2
slug = "tasks"
name = "Tasks"
version = "0.1.0"
description = "Personal todo list for the human owner (things you need to do, captured and updated by you and your agents)."

[runtime]
kind = "container"
build = "modules/tasks"
mcp_port = 8081
mcp_path = "/mcp"
ui_port = 8082

[storage]
postgres = true

[network]
egress = false

[ui]
title = "Tasks"
path = "/"

[tiers]
default = "write"
"tasks_list" = "read"
"tasks_get" = "read"
"tasks_add" = "write"
"tasks_update" = "write"
"tasks_complete" = "write"
