<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruffle Run</title>
  <style>
    :root {
      --bg: #09111b;
      --bg-alt: #111c2c;
      --panel: #132235;
      --text: #edf4ff;
      --muted: #9db4cf;
      --line: rgba(157, 180, 207, 0.22);
      --ok: #68d391;
      --bad: #fc8181;
      --run: #7dd3fc;
      --pending: #f6ad55;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(125, 211, 252, 0.14), transparent 28%),
        radial-gradient(circle at left center, rgba(104, 211, 145, 0.12), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: "SF Mono", "IBM Plex Mono", "Menlo", monospace;
    }

    header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #summary {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
    }

    main {
      padding: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 14px;
    }

    .pane {
      background: linear-gradient(180deg, rgba(19, 34, 53, 0.98), rgba(11, 20, 31, 0.98));
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      min-height: 320px;
      display: flex;
      flex-direction: column;
    }

    .pane-header {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }

    .status {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 10px;
    }

    .status.running { color: var(--run); }
    .status.complete { color: var(--ok); }
    .status.failed { color: var(--bad); }
    .status.pending { color: var(--pending); }

    pre {
      margin: 0;
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
      font-size: 12px;
      color: var(--text);
      flex: 1;
      overflow: auto;
    }

    #error {
      padding: 0 18px 18px;
      color: var(--bad);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="title">Ruffle Run</h1>
    </div>
    <div id="summary"></div>
  </header>
  <div id="error"></div>
  <main id="panes"></main>

  <script>
    const panesEl = document.getElementById("panes");
    const summaryEl = document.getElementById("summary");
    const errorEl = document.getElementById("error");
    const titleEl = document.getElementById("title");

    function pill(label, value) {
      return `<span class="pill">${label}: ${value}</span>`;
    }

    function renderSummary(state) {
      titleEl.textContent = `Ruffle Run ${state.runId}`;
      summaryEl.innerHTML = [
        pill("phase", state.phase),
        pill("mappers", state.mappers.length),
        pill("started", new Date(state.startedAt).toLocaleTimeString()),
        pill("finished", state.finishedAt ? new Date(state.finishedAt).toLocaleTimeString() : "running")
      ].join("");
      errorEl.textContent = state.error || "";
    }

    function renderPanes(panes) {
      const entries = Object.entries(panes);
      panesEl.innerHTML = entries.map(([id, pane]) => `
        <section class="pane">
          <div class="pane-header">
            <span>${pane.title} <span style="opacity:0.7">(${id})</span></span>
            <span class="status ${pane.status}">${pane.status}</span>
          </div>
          <pre>${escapeHtml(pane.content)}</pre>
        </section>
      `).join("");
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    async function refresh() {
      const [statusRes, panesRes] = await Promise.all([
        fetch("/api/status"),
        fetch("/api/panes")
      ]);
      renderSummary(await statusRes.json());
      renderPanes(await panesRes.json());
    }

    refresh().catch((error) => {
      errorEl.textContent = error.message;
    });
    setInterval(() => {
      refresh().catch((error) => {
        errorEl.textContent = error.message;
      });
    }, 1000);
  </script>
</body>
</html>
