name: suprise

options:
  minimumXcodeGenVersion: 2.38.0

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    revision: c71c5ed607c3853c041b8fd3c1042e6e5b5a29a3
  whisperSPM:
    url: https://github.com/ggml-org/whisper.spm.git
    revision: a2085436c2eb796af90956b62bd64731f5e5b823

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0

targets:
  suprise:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Sources
    resources:
      - path: Assets.xcassets
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: whisperSPM
        product: whisper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lowercaselabs.suprise
        PRODUCT_NAME: suprise
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: suprise
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: suprise uses the microphone to capture live dictation.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: suprise transcribes your speech while you dictate.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
