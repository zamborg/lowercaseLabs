<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sovereign Web Harness</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Sovereign App Store Web Harness</h1>
      <p class="muted">
        Browser-first test harness for Control Plane + Data Plane + web session cookie routing.
      </p>

      <section class="card">
        <h2>Endpoints</h2>
        <label>
          Control Plane URL
          <input id="controlPlaneUrl" value="http://localhost:8000" />
        </label>
        <label>
          Edge Router URL
          <input id="edgeRouterUrl" value="http://localhost:8001" />
        </label>
      </section>

      <section class="card">
        <h2>Auth</h2>
        <label>
          Email
          <input id="email" value="demo@local.dev" />
        </label>
        <label>
          Password
          <input id="password" type="password" value="password123" />
        </label>
        <div class="row">
          <button id="registerBtn">Register</button>
          <button id="loginBtn">Login</button>
          <button id="logoutCookieBtn" class="secondary">Clear Web Session Cookie</button>
        </div>
        <div class="row">
          <button id="setWebSessionBtn">Set Web Session Cookie</button>
          <button id="whoamiBtn" class="secondary">/auth/me</button>
        </div>
        <p id="authStatus" class="status"></p>
      </section>

      <section class="card">
        <h2>Developer Chart Parse + App Registration</h2>
        <label>
          Repo Path (local server path)
          <input id="repoPath" placeholder="/abs/path/to/repo" />
        </label>
        <label>
          Repo URL (https)
          <input id="repoUrl" placeholder="https://github.com/org/repo" />
        </label>
        <label>
          Ref (branch/tag/sha)
          <input id="repoRef" placeholder="main" />
        </label>
        <div class="row">
          <button id="parseChartBtn">Parse Chart</button>
        </div>

        <label>
          App Slug
          <input id="appSlug" value="echo-web" />
        </label>
        <label>
          App Name
          <input id="appName" value="Echo Web" />
        </label>
        <label>
          Docker Image
          <input id="dockerImage" placeholder="registry.example.com/echo-web:latest" />
        </label>
        <label>
          Fly App Name (optional override)
          <input id="flyAppName" placeholder="fly-app-name" />
        </label>
        <div class="row">
          <button id="registerFromChartBtn">Register App From Chart</button>
          <button id="listAppsBtn" class="secondary">List Apps</button>
        </div>
        <label>
          App ID (for provisioning)
          <input id="appId" placeholder="uuid-from-app-record" />
        </label>
        <label>
          Member User IDs (JSON array)
          <input id="memberUserIds" value="[]" />
        </label>
        <div class="row">
          <button id="provisionPodBtn">Provision Pod</button>
        </div>
        <pre id="appOutput" class="output"></pre>
      </section>

      <section class="card">
        <h2>Pod Routing + Web Open</h2>
        <label>
          Route App Slug
          <input id="routeSlug" value="echo-web" />
        </label>
        <div class="row">
          <button id="resolveRouteBtn">Resolve Route</button>
          <button id="openWebAppBtn" class="secondary">Open Web App</button>
        </div>

        <label>
          Request Path
          <input id="podPath" value="/api/whoami" />
        </label>
        <div class="row">
          <button id="podGetBtn">GET Pod</button>
          <button id="podPostBtn" class="secondary">POST Pod</button>
        </div>
        <label>
          JSON Body (POST)
          <textarea id="podBody">{"hello":"web"}</textarea>
        </label>
        <pre id="routeOutput" class="output"></pre>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
