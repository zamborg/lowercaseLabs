[project]
name = "sovereign-store-backend"
version = "0.1.0"
description = "Sovereign App Store control and data planes"
readme = "README.md"
authors = [{ name = "zubin aysola", email = "zubinaysola@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17.0",
  "asyncpg>=0.30.0",
  "email-validator>=2.2.0",
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "passlib[bcrypt]>=1.7.4",
  "pydantic-settings>=2.11.0",
  "python-jose[cryptography]>=3.5.0",
  "redis>=6.4.0",
  "sqlalchemy[asyncio]>=2.0.43",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.10",
]

[project.scripts]
control-plane = "sovereign_store.control_plane.main:run"
data-plane = "sovereign_store.data_plane.main:run"
init-db = "sovereign_store.scripts.init_db:main"
db-upgrade = "sovereign_store.scripts.db_upgrade:main"
manual-e2e = "sovereign_store.scripts.manual_e2e:main"
manual-web-e2e = "sovereign_store.scripts.manual_web_e2e:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
