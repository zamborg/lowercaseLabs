name: TheVoid
options:
  bundleIdPrefix: com.lowercaselabs
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: 9G57J2JMF7
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  TheVoid:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Model
        type: folder
        buildPhase: resources
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: MLXSwiftLM
        product: MLXGuidedGeneration
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    info:
      path: Sources/Info.plist
      properties:
        CKSharingSupported: true
        VoidICloud: false   # set true together with CODE_SIGN_ENTITLEMENTS: Sources/TheVoid-iCloud.entitlements
        UIBackgroundModes: [remote-notification]
        CFBundleDisplayName: The Void
        UILaunchScreen: {UIColorName: "", UIImageName: ""}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: The Void records your voice notes on this device.
        NSSpeechRecognitionUsageDescription: The Void transcribes your voice notes on this device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lowercaselabs.thevoid
        GENERATE_INFOPLIST_FILE: NO
  MacHarness:
    # Mac command-line check of the exact Tagger.swift the app ships. Real Metal, no phone needed.
    # ./validate.sh builds and runs it.
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - MacHarness
      - Sources/Tagger.swift
      - Sources/Transcriber.swift
      - Sources/Taxonomy.swift
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: MLXSwiftLM
        product: MLXGuidedGeneration
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_NAME: MacHarness
        CODE_SIGN_IDENTITY: "-"
