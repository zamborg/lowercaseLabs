# Fly app config for self-hosted Postgres (container-based) on a single machine.
# Override app/region/volume via backend/scripts/fly_selfhosted_postgres_bootstrap.sh

app = "thevoid-local-postgres"
primary_region = "sjc"

[build]
  image = "postgres:16"

[env]
  PGDATA = "/data/postgres"
  POSTGRES_DB = "thevoid"
  POSTGRES_USER = "thevoid"

[processes]
  app = "docker-entrypoint.sh postgres"

[[mounts]]
  source = "thevoid_db_data"
  destination = "/data"
  initial_size = "10gb"
  processes = ["app"]
