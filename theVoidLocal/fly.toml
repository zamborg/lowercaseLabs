# fly.toml app configuration file for theVoidLocal deployment
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'thevoid-local'
primary_region = 'sjc'

[build]
  dockerfile = 'backend/Dockerfile'

[processes]
  app = 'uvicorn app.main:app --host 0.0.0.0 --port 8080'

[deploy]
  release_command = 'alembic upgrade head'

[env]
  ENVIRONMENT = 'production'
  OBJECT_STORAGE_ROOT = '/data/storage'
  INLINE_WORKER_ENABLED = 'true'
  AUTO_CREATE_SCHEMA = 'false'
  ALLOW_DEV_IDENTITY_TOKENS = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']
  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[mounts]
  source = 'thevoid_data'
  destination = '/data'
  initial_size = '10gb'
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
