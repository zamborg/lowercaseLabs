name: Simple Zagency Branch Update

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: read

jobs:
  update-zagency:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Update zagency branch
      run: |
        # Create temporary directory with only zagency content
        mkdir -p /tmp/zagency-content
        
        # Copy all zagency content including hidden files
        shopt -s dotglob
        cp -r zagency/* /tmp/zagency-content/ 2>/dev/null || true
        shopt -u dotglob
        
        # Create/checkout zagency branch
        git checkout -B zagency
        
        # Remove all current content except .git
        find . -maxdepth 1 ! -name '.git' ! -name '.' ! -name '..' -exec rm -rf {} +
        
        # Copy zagency content to root
        shopt -s dotglob
        cp -r /tmp/zagency-content/* . 2>/dev/null || true
        shopt -u dotglob
        
        # Add all files and commit
        git add .
        git commit -m "Update zagency branch from main" || git commit --allow-empty -m "Update zagency branch from main"
        
        # Push the branch
        git push origin zagency --force 