name: Update Zagency Branch

on:
  push:
    branches: [ main ]

jobs:
  update-zagency-branch:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Create and update zagency branch
      run: |
        # Check if zagency folder exists
        if [ ! -d "zagency" ]; then
          echo "zagency folder not found, skipping..."
          exit 0
        fi
        
        # Store the current commit hash for reference
        MAIN_COMMIT=$(git rev-parse HEAD)
        
        # Create a temporary directory to store zagency contents
        mkdir -p /tmp/zagency-extract
        
        # Copy zagency folder contents to temp directory
        cp -r zagency/* /tmp/zagency-extract/ 2>/dev/null || echo "No regular files to copy"
        
        # Copy hidden files from zagency folder if they exist
        if ls zagency/.[!.]* 1> /dev/null 2>&1; then
          cp -r zagency/.[!.]* /tmp/zagency-extract/ 2>/dev/null || echo "No hidden files to copy"
        fi
        
        # Create orphan branch for clean history
        git checkout --orphan zagency-temp
        
        # Remove all files from the working directory
        git rm -rf . 2>/dev/null || true
        find . -name ".*" -not -name ".git" -not -name "." -not -name ".." -delete 2>/dev/null || true
        
        # Copy zagency contents to root of the branch
        if [ "$(ls -A /tmp/zagency-extract 2>/dev/null)" ]; then
          cp -r /tmp/zagency-extract/* . 2>/dev/null || echo "No files to copy to root"
          if ls /tmp/zagency-extract/.[!.]* 1> /dev/null 2>&1; then
            cp -r /tmp/zagency-extract/.[!.]* . 2>/dev/null || echo "No hidden files to copy to root"
          fi
        else
          echo "No files found in zagency folder"
          # Create empty commit if no files
          touch .gitkeep
        fi
        
        # Add all files to git
        git add .
        
        # Commit the changes
        if git diff --staged --quiet; then
          echo "No changes detected, creating empty commit"
          git commit --allow-empty -m "Update zagency branch from main (no changes) - commit: ${MAIN_COMMIT}"
        else
          git commit -m "Update zagency branch from main - commit: ${MAIN_COMMIT}"
        fi
        
        # Force push to zagency branch
        git push origin zagency-temp:zagency --force
        
        # Clean up by switching back to main and removing temp branch
        git checkout main
        git branch -D zagency-temp 2>/dev/null || true
        
        echo "Successfully updated zagency branch!" 