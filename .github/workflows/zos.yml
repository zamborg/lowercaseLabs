name: ZOS CI

on:
  push:
    paths:
      - "zos/**"
      - ".github/workflows/zos.yml"
  pull_request:
    paths:
      - "zos/**"
      - ".github/workflows/zos.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zos
          POSTGRES_PASSWORD: zos
          POSTGRES_DB: zos_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U zos -d zos_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Core — lint and test
        working-directory: zos
        env:
          ZOS_TEST_DATABASE_URL: postgresql://zos:zos@127.0.0.1:55432/zos_test
        run: |
          uv sync --frozen
          uv run ruff check
          uv run pytest

      - name: Device bridge — lint and test
        working-directory: zos/device
        run: |
          uv sync --frozen
          uv run ruff check
          uv run pytest

      - name: Mac device — lint and test
        working-directory: zos/devices/mac
        run: |
          uv sync --frozen
          uv run ruff check
          uv run pytest

      - name: Inbox module — lint and test
        working-directory: zos/modules/inbox
        env:
          ZOS_TEST_DATABASE_URL: postgresql://zos:zos@127.0.0.1:55432/zos_test
        run: |
          uv sync --frozen
          uv run ruff check
          uv run pytest

      - name: Memory module — lint and test
        working-directory: zos/modules/memory
        env:
          ZOS_TEST_DATABASE_URL: postgresql://zos:zos@127.0.0.1:55432/zos_test
        run: |
          uv sync --frozen
          uv run ruff check
          uv run pytest

      - name: Google module — lint and test
        working-directory: zos/modules/google
        env:
          ZOS_TEST_DATABASE_URL: postgresql://zos:zos@127.0.0.1:55432/zos_test
        run: |
          uv sync --frozen
          uv run ruff check
          uv run pytest

      - name: Tasks module — lint and test
        working-directory: zos/modules/tasks
        env:
          ZOS_TEST_DATABASE_URL: postgresql://zos:zos@127.0.0.1:55432/zos_test
        run: |
          uv sync --frozen
          uv run ruff check
          uv run pytest

      - name: Files module — lint and test
        working-directory: zos/modules/files
        env:
          ZOS_TEST_DATABASE_URL: postgresql://zos:zos@127.0.0.1:55432/zos_test
        run: |
          uv sync --frozen
          uv run ruff check
          uv run pytest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Excalidraw module — build offline editor, lint and test
        working-directory: zos/modules/excalidraw
        env:
          TEST_DATABASE_URL: postgresql://zos:zos@127.0.0.1:55432/zos_test
        run: |
          npm ci --prefix editor
          npm run build --prefix editor
          uv sync --frozen
          uv run playwright install --with-deps chromium
          uv run ruff check
          uv run pytest
