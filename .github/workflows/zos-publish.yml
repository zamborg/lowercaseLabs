name: Publish ZOS Images to GHCR

on:
  push:
    tags:
      - "zos-v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: zos
            context: zos
            dockerfile: zos/deploy/Dockerfile
          - name: zos-inbox
            context: zos/modules/inbox
            dockerfile: zos/modules/inbox/Dockerfile
          - name: zos-memory
            context: zos/modules/memory
            dockerfile: zos/modules/memory/Dockerfile
          - name: zos-google
            context: zos/modules/google
            dockerfile: zos/modules/google/Dockerfile
          - name: zos-tasks
            context: zos/modules/tasks
            dockerfile: zos/modules/tasks/Dockerfile
          - name: zos-files
            context: zos/modules/files
            dockerfile: zos/modules/files/Dockerfile
          - name: zos-excalidraw
            context: zos/modules/excalidraw
            dockerfile: zos/modules/excalidraw/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.name }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Record digest summary
        run: |
          echo "- \`${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.name }}@${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
