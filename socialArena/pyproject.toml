[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "social-arena"
version = "0.1.0"
description = "Offline-first reproducible agent game experiment harness"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
social-arena = "social_arena.__main__:main"

[tool.setuptools.packages.find]
include = ["social_arena*"]
